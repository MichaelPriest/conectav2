name: Conecta V2 • Mobile validation

on:
  push:
    branches:
      - feature/legacy-social-features
    paths:
      - 'mobile/**'
      - '.github/workflows/conecta-mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/conecta-mobile-ci.yml'
  workflow_dispatch:

concurrency:
  group: conecta-mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile tests, typecheck and Expo dependency validation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      EXPO_PUBLIC_CONECTA_DISTRIBUTION: sideload
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package.json
      - name: Install pinned project dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Run mobile regression tests
        run: npm test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Validate Expo dependency versions
        run: npx expo install --check
