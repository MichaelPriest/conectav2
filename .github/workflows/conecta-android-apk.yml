# Homologação Alpha 0.3.1 consolidada: respostas de mídia, proteção de rascunhos e chat seguro.
name: Conecta V2 · Android APK de testes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/conecta-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Compilar APK instalável de homologação
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle e preparar ambiente Android
        uses: gradle/actions/setup-gradle@v4
      - name: Identificar versão do APK de homologação
        run: |
          echo "Conecta V2 Mobile: $(node -p 'require("./package.json").version')"
          echo "Git SHA: $GITHUB_SHA"
      # GitHub ubuntu-latest already includes the Android SDK.
      # Do not invoke deprecated sdkmanager 'tools' package installation.
      - name: Verificar Android SDK do executor
        run: |
          test -d "$ANDROID_HOME"
          echo "SDK Android disponível: $ANDROID_HOME"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Conferir aplicação e TypeScript
        run: npm test && npm run typecheck && npx expo install --check
      - name: Gerar projeto nativo Android
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Gerar APK release com assinatura local de teste (NÃO para Play Store)
        run: cd android && chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Publicar artefato de teste
        uses: actions/upload-artifact@v4
        with:
          name: conecta-v2-android-apk-teste
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
