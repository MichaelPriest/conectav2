# Homologação Alpha 0.7.2: feed multimídia, imagens privadas, chamadas WebRTC e permissões.
name: Conecta V2 · Android APK de testes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/conecta-android-apk.yml'
      - 'mobile/**'
  workflow_dispatch:

concurrency:
  group: conecta-android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-apk:
    name: Compilar APK instalável de homologação
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      NODE_OPTIONS: --max-old-space-size=4096
      EXPO_PUBLIC_CONECTA_DISTRIBUTION: sideload
      EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.CONECTA_EXPO_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle e preparar ambiente Android
        uses: gradle/actions/setup-gradle@v4
      - name: Identificar versão do APK de homologação
        run: |
          echo "Conecta V2 Mobile: $(node -p 'require("./package.json").version')"
          echo "Git SHA: $GITHUB_SHA"
      # GitHub ubuntu-latest already includes the Android SDK.
      # Do not invoke deprecated sdkmanager 'tools' package installation.
      - name: Verificar Android SDK do executor
        run: |
          test -d "$ANDROID_HOME"
          echo "SDK Android disponível: $ANDROID_HOME"
      - name: Instalar dependências
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Conferir aplicação e TypeScript
        run: npm test && npm run typecheck && npx expo install --check
      - name: Gerar projeto nativo Android
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Gerar APK release com assinatura local de teste (NÃO para Play Store)
        run: cd android && chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Validar permissões reais no APK Android
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt"
          "$aapt" dump permissions "$apk" | tee /tmp/conecta-apk-permissions.txt
          for required in INTERNET CAMERA RECORD_AUDIO POST_NOTIFICATIONS REQUEST_INSTALL_PACKAGES; do
            if ! grep -Fq "android.permission.$required" /tmp/conecta-apk-permissions.txt; then
              echo "::error::Permissão exigida ausente: $required"
              exit 1
            fi
          done
          for blocked in ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION ACCESS_BACKGROUND_LOCATION READ_CONTACTS WRITE_CONTACTS READ_SMS SEND_SMS READ_CALL_LOG READ_PHONE_STATE MANAGE_EXTERNAL_STORAGE SYSTEM_ALERT_WINDOW SCHEDULE_EXACT_ALARM USE_EXACT_ALARM; do
            if grep -Fq "android.permission.$blocked'" /tmp/conecta-apk-permissions.txt; then
              echo "::error::Permissão desnecessária presente: $blocked"
              exit 1
            fi
          done
          echo "Permissões reais verificadas no pacote Conecta sideload."
      - name: Garantir APK assinado e registrar hash SHA-256
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$signer"
          "$signer" verify --verbose --print-certs "$apk"
          sha256sum "$apk"
      - name: Publicar artefato de teste
        uses: actions/upload-artifact@v4
        with:
          name: conecta-v2-android-0.7.2-alpha
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14


      # Alpha-only: the previous APKs and this runner's template are signed
      # by the same TEST certificate. A mismatch must never be auto-updated.
      # Replace this with a secured release keystore before any production launch.
      - name: Validar continuidade da assinatura dos APKs Alpha
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          signer="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          actual="$("$signer" verify --print-certs "$apk" | awk '/certificate SHA-256 digest:/ {print $NF; exit}')"
          expected="fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Certificado diferente do usado nas Alpha 0.7.1/0.7.2. Não publicar atualização incompatível."
            exit 1
          fi
          echo "Certificado Alpha de teste consistente (NÃO é assinatura de produção)."
      - name: Publicar pre-release Alpha para atualizador do aplicativo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Versão de release inválida."
            exit 1
          fi
          tag="mobile-v$version"
          filename="conecta-v2-android-$version.apk"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::Pre-release $tag já existe. Nada será sobrescrito."
            exit 0
          fi
          install -m 0644 android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$filename"
          digest="$(sha256sum "$RUNNER_TEMP/$filename" | cut -d ' ' -f 1)"
          bytes="$(stat -c%s "$RUNNER_TEMP/$filename")"
          cat > "$RUNNER_TEMP/conecta-release-notes.txt" <<EOF
          Conecta Mobile Alpha $version (Android). Versão de homologação.

          Atualizador no aplicativo: a versão instalada é comparada com esta
          pré-release, e o APK é verificado por tamanho e SHA-256.
          A instalação exige confirmação explícita do Android.

          AVISO: APK assinado com certificado Alpha de teste usado desde 0.7.1.
          Não é assinatura definitiva de loja. Não usar em produção.

          APK-SHA256: $digest
          APK-SIZE: $bytes
          EOF
          gh release create "$tag" "$RUNNER_TEMP/$filename#$filename" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Conecta Mobile Alpha $version" --prerelease \
            --notes-file "$RUNNER_TEMP/conecta-release-notes.txt"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,assets \
            --jq '{tag: .tagName, apk: [.assets[].name]}'
