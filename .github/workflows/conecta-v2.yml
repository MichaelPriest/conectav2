name: Conecta V2 • Next.js validation

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'supabase/**'
      - 'moderation-worker/**'
      - '.github/workflows/conecta-v2.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'supabase/**'
      - 'moderation-worker/**'
      - '.github/workflows/conecta-v2.yml'
  workflow_dispatch:

concurrency:
  group: conecta-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Compile open-source moderation worker
        run: python3 -m py_compile ../moderation-worker/server.py
      - name: Run real local NSFWJS moderation model (no API key)
        run: npm run test:moderation
      - name: Real automatic text/video moderation tests
        run: npm run test:automod
      - name: Moderation workflow approval and private preview regressions
        run: node --test tests/moderation-flow.test.cjs
      - name: Chat V4 timeline pagination regressions
        run: node --test tests/chat-v4-timeline.test.cjs
      - name: Chat V4 group role regressions
        run: node --test tests/chat-v4-group-permissions.test.cjs
      - name: Conecta 100 achievements and unique first-user award
        run: node --test tests/profile-achievements.test.cjs
      - name: Privacy, Web Push, group calls and TURN regression tests
        run: node --test tests/chat-web-push.test.cjs tests/chat-web-push-subject.test.cjs tests/chat-push-signature.test.cjs tests/chat-push-origin.test.cjs tests/mobile-push-security.test.cjs tests/chat-presence.test.cjs tests/chat-calls.test.cjs tests/chat-calls-realtime.test.cjs tests/chat-rtc-connectivity.test.cjs tests/chat-trickle-ice.test.cjs tests/chat-call-tones.test.cjs tests/chat-group-calls.test.cjs tests/chat-turn-credentials.test.cjs
      - name: Monetization access control regression tests
        run: node --test tests/monetization-access.test.cjs
      - name: Story sharing security regressions
        run: node --test tests/story-sharing.test.cjs
      - name: Verify official Android release links and app download navigation
        run: node --test tests/app-downloads.test.cjs tests/saved-posts.test.cjs tests/sidebar-navigation.test.cjs tests/public-links.test.cjs
      - name: Legacy social drafts and hashtag discovery regressions
        run: node --test tests/legacy-social-features.test.cjs
      - name: Check TypeScript
        run: npm run typecheck
      - name: Regression tests for nullable profile details
        run: npm run test:profile
      - name: Verify bundled Human browser library
        run: npm run test:human
      - name: Verify offline CIN signature parser
        run: npm run test:cin
      - name: Verify server-side CIN preflight and identity method disclosures
        run: npm run test:cin-server && npm run test:identity-methods
      - name: Verify Conecta ID method disclosure and paid provider gate
        run: npm run test:identity-methods-ui && npm run test:identity-start-paid-gate
      - name: Conecta ID privacy-minimal verdict and guardian rules
        run: npm run test:conecta-id && npm run test:family-relationships && npm run test:network-access
      - name: Age assurance policy and Play Integrity regressions
        run: npm run test:age-policy && npm run test:age-policy-route && npm run test:age-signal-integrity && node --test tests/ads-eligibility-age-policy.test.cjs
      - name: Gov.br signed PDF challenge tests
        run: npm run test:govbr
      - name: Validate identity origin behind proxies
        run: npm run test:origin
      - name: Registration age and privacy tests
        run: node --test tests/registration-age.test.cjs
      - name: Verify legacy RG OCR preflight
        run: npm run test:legacy-rg
      - name: Registration completion safeguards
        run: npm run test:completion
      - name: Build Next.js
        run: npm run build
