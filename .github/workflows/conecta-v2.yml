name: Conecta V2 • Next.js validation

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'supabase/**'
      - '.github/workflows/conecta-v2.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'supabase/**'
      - '.github/workflows/conecta-v2.yml'
  workflow_dispatch:

concurrency:
  group: conecta-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Check TypeScript
        run: npm run typecheck
      - name: Regression tests for nullable profile details
        run: npm run test:profile
      - name: Verify bundled Human browser library
        run: npm run test:human
      - name: Verify offline CIN signature parser
        run: npm run test:cin
      - name: Build Next.js
        run: npm run build
