name: Conecta V2 • Next.js validation

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'supabase/**'
      - 'moderation-worker/**'
      - '.github/workflows/conecta-v2.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'supabase/**'
      - 'moderation-worker/**'
      - '.github/workflows/conecta-v2.yml'
  workflow_dispatch:

concurrency:
  group: conecta-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package.json
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Compile open-source moderation worker
        run: python3 -m py_compile ../moderation-worker/server.py
      - name: Run real local NSFWJS moderation model (no API key)
        run: npm run test:moderation
      - name: Real automatic text/video moderation tests
        run: npm run test:automod
      - name: Chat V4 timeline pagination regressions
        run: node --test tests/chat-v4-timeline.test.cjs
      - name: Chat V4 group role regressions
        run: node --test tests/chat-v4-group-permissions.test.cjs
      - name: Privacy and Web Push regression tests
        run: node --test tests/chat-web-push.test.cjs tests/chat-web-push-subject.test.cjs tests/chat-push-signature.test.cjs tests/chat-push-origin.test.cjs tests/chat-presence.test.cjs tests/chat-calls.test.cjs tests/chat-calls-realtime.test.cjs
      - name: Check TypeScript
        run: npm run typecheck
      - name: Regression tests for nullable profile details
        run: npm run test:profile
      - name: Verify bundled Human browser library
        run: npm run test:human
      - name: Verify offline CIN signature parser
        run: npm run test:cin
      - name: Gov.br signed PDF challenge tests
        run: npm run test:govbr
      - name: Validate identity origin behind proxies
        run: npm run test:origin
      - name: Registration age and privacy tests
        run: node --test tests/registration-age.test.cjs
      - name: Verify legacy RG OCR preflight
        run: npm run test:legacy-rg
      - name: Registration completion safeguards
        run: npm run test:completion
      - name: Build Next.js
        run: npm run build
